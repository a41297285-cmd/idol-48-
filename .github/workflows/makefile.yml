name: Build NDS Game

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
    - uses: actions/checkout@v4

    - name: Build the game
      run: make

    - name: Upload NDS file
      uses: actions/upload-artifact@v4
      with:
        name: Idol_Producer_48_ROM
        path: "*.nds"

